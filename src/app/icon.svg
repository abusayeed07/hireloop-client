<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Dark Background Circle (optional, but looks great on dark/light tabs) -->
  <rect width="100" height="100" rx="20" fill="#0d0d0e" />
  
  <!-- The Letter H (Blue gradient) -->
  <path d="M30 30 L30 70 M30 50 L70 50 M70 30 L70 70" 
        stroke="url(#blueGrad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- The Letter L (Orange gradient) -->
  <path d="M70 30 L70 70 L40 70" 
        stroke="url(#orangeGrad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />

  <!-- DEFINE GRADIENTS -->
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>